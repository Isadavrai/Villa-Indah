name: Build Villa Indah Telegram Collages

on:
  push:
    paths:
      - 'scripts/build_telegram_collages.py'
      - '.github/workflows/build-telegram-collages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: villa-telegram-collage-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Generate RU and EN cards from owner-supplied villa photography
        run: python scripts/build_telegram_collages.py
      - name: Validate outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('assets/telegram')
          for lang in ('ru','en'):
              paths=list((root/lang).glob('*.jpg'))
              assert len(paths)==10, f'{lang}: expected 10, got {len(paths)}'
              assert all(x.stat().st_size>25000 for x in paths)
          assert (root/'manifest.json').exists()
          PY
      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/telegram/ru assets/telegram/en assets/telegram/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate approved-photo bilingual Telegram marketing cards"
            git push origin HEAD:main
          fi
