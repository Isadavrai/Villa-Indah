name: Villa Indah Premium V2 — RU + EN
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-verify-deliver-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
          python -m pip install numpy Pillow opencv-python-headless scipy
      - name: Render reference-led RU and EN videos
        run: python -u scripts/premium-reels-v2/build_v2.py --repo . --out dist/reels-v2
      - name: Verify both final MP4 files
        run: python -u scripts/premium-reels-v2/verify_v2.py --repo . --out dist/reels-v2
      - name: Package report and source scripts
        run: python scripts/premium-reels-v2/package_v2.py
      - name: Upload Russian V2 video
        uses: actions/upload-artifact@v4
        with:
          name: Villa_Indah_Premium_V2_RU
          path: dist/reels-v2/Villa_Indah_Premium_V2_RU.mp4
          compression-level: 0
          retention-days: 90
      - name: Upload English V2 video
        uses: actions/upload-artifact@v4
        with:
          name: Villa_Indah_Premium_V2_EN
          path: dist/reels-v2/Villa_Indah_Premium_V2_EN.mp4
          compression-level: 0
          retention-days: 90
      - name: Upload V2 production kit
        uses: actions/upload-artifact@v4
        with:
          name: Villa_Indah_Premium_V2_Production_Kit
          path: |
            dist/reels-v2/Villa_Indah_Premium_V2_Production_Kit.zip
            dist/reels-v2/*Preview*.jpg
            dist/reels-v2/*Contact*.jpg
            dist/reels-v2/*.txt
            dist/reels-v2/*.json
          compression-level: 0
          retention-days: 90
