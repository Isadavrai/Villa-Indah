name: Villa Indah — Quiet Hours and Golden Rhythm
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open source tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
          python -m pip install numpy Pillow opencv-python-headless scipy
      - name: Export two films from Villa Indah photos
        run: python -u scripts/reels-v3/render.py --repo . --out dist/reels-v3 --work work/reels-v3
      - name: Decode and verify both MP4s
        run: python -u scripts/reels-v3/verify.py dist/reels-v3
      - name: Upload Quiet Hours
        uses: actions/upload-artifact@v4
        with:
          name: Villa_Indah_Quiet_Hours
          path: dist/reels-v3/Villa_Indah_Quiet_Hours.mp4
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
      - name: Upload Golden Rhythm
        uses: actions/upload-artifact@v4
        with:
          name: Villa_Indah_Golden_Rhythm
          path: dist/reels-v3/Villa_Indah_Golden_Rhythm.mp4
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
      - name: Save QA frames and checksums
        uses: actions/upload-artifact@v4
        with:
          name: Villa_Indah_QA
          path: |
            dist/reels-v3/*_contact.jpg
            dist/reels-v3/SHA256SUMS.txt
          retention-days: 90
          if-no-files-found: error
