name: Villa Indah - Real Photo Reels (RU + EN)

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/render_villa_reels.py'
      - '.github/workflows/render-villa-reels.yml'

permissions:
  contents: read

concurrency:
  group: villa-photo-reels
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free video and image rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
      - name: Verify source and basic dependencies
        run: |
          python -m py_compile scripts/render_villa_reels.py
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 2
          test -f 'assets/photos-new/Private Swimming Pool/03.webp'
          test -f 'assets/photos-new/Living room/01.webp'
          test -f 'assets/photos-new/Master Bedroom/01.webp'
          test -f 'assets/photos-new/Beach/01.webp'
      - name: Render 1080x1920 MP4 videos in RU and EN
        run: python scripts/render_villa_reels.py
      - name: Verify finished videos are playable
        run: |
          for f in dist/villa-video/*.mp4; do
            test -s "$f"
            ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "$f"
            ffmpeg -v error -xerror -i "$f" -frames:v 1 -f null -
          done
      - name: Upload real-photo video drafts
        uses: actions/upload-artifact@v4
        with:
          name: villa-indah-photo-reels-ru-en
          path: |
            dist/villa-video/*.mp4
            dist/villa-video/cards/ru_01.jpg
            dist/villa-video/cards/en_01.jpg
          retention-days: 14
          if-no-files-found: error
